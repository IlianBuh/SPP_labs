<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пиксельный холст</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="banner" class="banner hidden">
    <span id="banner-text"></span>
  </div>

  <main>
    <section id="auth-view" class="auth-view hidden">
      <div class="auth-card">
        <h1>Пиксельный холст</h1>
        <p class="subtitle">Многопользовательская игра: красите клетки, растёт ваш счёт</p>
        <div class="tabs">
          <button id="tab-login" class="tab active" type="button">Вход</button>
          <button id="tab-register" class="tab" type="button">Регистрация</button>
        </div>
        <form id="auth-form">
          <label for="username">Логин (3–24: латиница, цифры, _)</label>
          <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}">
          <label for="password">Пароль (от 6 символов)</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="72">
          <div id="auth-error" class="form-error hidden"></div>
          <button id="auth-submit" type="submit">Войти</button>
        </form>
      </div>
    </section>

    <section id="game-view" class="game-view hidden">
      <header class="topbar">
        <span class="logo">Пиксельный холст <span class="dim">100×100</span></span>
        <div class="user-info">
          <span id="user-name"></span>
          <span class="dim" id="user-stats"></span>
          <span id="conn-status" class="conn conn-offline">нет связи</span>
          <button id="logout-btn" type="button">Выйти</button>
        </div>
      </header>

      <div class="layout">
        <div class="canvas-column">
          <div class="canvas-wrap">
            <canvas id="board" width="100" height="100"></canvas>
            <canvas id="preview" width="100" height="100"></canvas>
          </div>
          <div class="controls">
            <div class="cooldown-row">
              <span class="dim">Кулдаун:</span>
              <div class="cooldown-track"><div id="cooldown-bar" class="cooldown-bar full"></div></div>
            </div>
            <div id="palette" class="palette"></div>
          </div>
        </div>

        <aside class="side">
          <section class="panel">
            <h2>Онлайн</h2>
            <ul id="players-list" class="plain-list"></ul>
          </section>
          <section class="panel">
            <h2>Лидеры</h2>
            <ol id="leaderboard-list" class="plain-list"></ol>
          </section>
        </aside>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
