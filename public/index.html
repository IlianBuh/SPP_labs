<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager SPA</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Менеджер задач (SPA)</h1>

    <!-- Блок уведомления об ошибках -->
    <div id="error-banner" class="error-banner hidden"></div>
    <div id="success-banner" class="success-banner hidden"></div>

    <!-- Экран входа / регистрации -->
    <section id="auth-screen">
      <div id="auth-tabs" class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Вход</button>
        <button class="auth-tab" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-login">Логин</label>
          <input type="text" id="login-login" name="login" required>
        </div>
        <div class="form-group">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" name="password" required>
        </div>
        <div class="auth-links">
          <a href="#" id="forgot-password-link">Забыли пароль?</a>
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label for="reg-email">Email *</label>
          <input type="email" id="reg-email" name="email" required>
        </div>
        <div class="form-group">
          <label for="reg-login">Логин *</label>
          <input type="text" id="reg-login" name="login" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Пароль *</label>
          <input type="password" id="reg-password" name="password" required>
        </div>
        <div class="form-group">
          <label for="reg-password-confirm">Подтверждение пароля *</label>
          <input type="password" id="reg-password-confirm" name="passwordConfirm" required>
        </div>
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
      </form>

      <form id="forgot-password-form" class="auth-form hidden">
        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" name="email" required>
        </div>
        <button type="submit" class="btn btn-primary">Отправить ссылку для сброса</button>
        <button type="button" id="back-to-login-btn" class="btn">Назад к входу</button>
      </form>

      <form id="reset-password-form" class="auth-form hidden">
        <div class="form-group">
          <label for="reset-password">Новый пароль *</label>
          <input type="password" id="reset-password" name="password" required>
        </div>
        <div class="form-group">
          <label for="reset-password-confirm">Подтверждение пароля *</label>
          <input type="password" id="reset-password-confirm" name="passwordConfirm" required>
        </div>
        <button type="submit" class="btn btn-primary">Сменить пароль</button>
        <button type="button" id="reset-back-to-login-btn" class="btn">Назад к входу</button>
      </form>
    </section>

    <!-- Основное приложение -->
    <div id="app-screen" class="hidden">
      <div class="app-header">
        <div id="user-info" class="user-info"></div>
        <button id="logout-btn" class="btn btn-danger">Выйти</button>
      </div>

      <!-- Форма создания задачи -->
      <section id="create-task-card" class="card hidden">
        <h2>Новая задача</h2>
        <form id="create-task-form">
          <div class="form-group">
            <label for="title">Название *</label>
            <input type="text" id="title" name="title" required>
          </div>
          <div class="form-group">
            <label for="description">Описание</label>
            <textarea id="description" name="description" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="dueDate">Срок выполнения *</label>
            <input type="date" id="dueDate" name="dueDate" required>
          </div>
          <div class="form-group">
            <label for="attachment">Прикрепить файл</label>
            <input type="file" id="attachment" name="attachment">
          </div>
          <button type="submit" class="btn btn-primary">Добавить задачу</button>
        </form>
      </section>

      <!-- Панель сессий (все роли) -->
      <section id="sessions-panel" class="card">
        <h2>Активные подключения</h2>
        <div id="sessions-list" class="users-list"></div>
      </section>

      <!-- Панель админа -->
      <section id="admin-panel" class="card hidden">
        <h2>Панель админа</h2>
        <div id="users-list" class="users-list"></div>
        <div id="admin-sessions-block" class="hidden">
          <h3>Сессии пользователей</h3>
          <div id="admin-sessions-list" class="users-list"></div>
        </div>
      </section>

      <!-- Фильтрация -->
      <section class="filters">
        <button class="filter-btn active" data-status="all">Все</button>
        <button class="filter-btn" data-status="pending">В процессе</button>
        <button class="filter-btn" data-status="completed">Завершенные</button>
      </section>

      <!-- Список задач -->
      <section id="tasks-list" class="tasks-list"></section>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
